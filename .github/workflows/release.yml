name: Release

# Automatic publishing. Push a version tag (for example "v5.0.0") and this
# workflow packages the app on each platform's own runner and attaches the
# archives to a GitHub Release. "Run workflow" (workflow_dispatch) builds the
# same artifacts; fill in "tag" to also publish them as a Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Also publish a Release for this tag (e.g. v5.0.0); leave empty to only build artifacts"
        required: false
        default: ""

permissions:
  contents: write

env:
  # The release tag: the pushed tag, or the "tag" input on a manual run.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  package:
    name: package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
    steps:
      - uses: actions/checkout@v4

      # An app with its own Rust crate (ext/tls-native) makes nsh build the
      # release runner from source, which needs GTK 4 and WebKitGTK 6.0 headers
      # on Linux (see https://nsh.dev/docs/linux#requirements). Without them
      # cargo fails in glib-sys: "Package glib-2.0 was not found".
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libwebkitgtk-6.0-dev clang pkg-config

      - name: Install nsh (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install nsh (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://nsh.dev/install.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value "$env:LOCALAPPDATA\nsh\bin"

      - name: nsh version
        run: nsh --version

      - name: Type check
        run: nsh check

      - name: Package (${{ matrix.target }})
        shell: bash
        run: |
          set -euo pipefail
          args=(package . --target ${{ matrix.target }} -o "out/${{ matrix.target }}")
          # Use the tag as the app version on a release build (v5.0.0 -> 5.0.0).
          case "${RELEASE_TAG:-}" in
            v[0-9]*) args+=(--app-version "${RELEASE_TAG#v}") ;;
          esac
          nsh "${args[@]}"
          echo "---- output ----"
          find "out/${{ matrix.target }}" -maxdepth 2 -print

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          case "${{ matrix.target }}" in
            windows)
              find "out/windows" -maxdepth 1 -type f \( -name '*.zip' -o -name '*-setup.exe' \) -exec cp {} release/ \;
              ;;
            linux)
              find "out/linux" -maxdepth 1 -type f -name '*.tar.gz' -exec cp {} release/ \;
              ;;
            macos)
              # Keep the .app bundle intact (symlinks, permissions) inside a zip.
              find "out/macos" -maxdepth 1 -type d -name '*.app' -exec \
                ditto -c -k --sequesterRsrc --keepParent {} "release/WeChat-Selkies-macos.zip" \;
              ;;
          esac
          echo "---- release ----"
          ls -la release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la artifacts
          if [ -z "${RELEASE_TAG:-}" ]; then
            echo "no release tag; skipping"; exit 0
          fi

          # GitHub's API can answer 5xx while it is degraded; retry with a
          # widening backoff instead of failing the release.
          retry() {
            local n=0
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge 5 ]; then echo "giving up after $n attempts"; return 1; fi
              echo "attempt $n failed, retrying in $((n * 15))s…"
              sleep $((n * 15))
            done
          }

          TAG="${RELEASE_TAG}"
          # Create the release once; a rerun reuses it (and re-uploads assets).
          if ! gh release view "$TAG" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              retry gh release create "$TAG" -R "${GITHUB_REPOSITORY}" \
                --title "$TAG" --generate-notes --verify-tag
            else
              retry gh release create "$TAG" -R "${GITHUB_REPOSITORY}" \
                --title "$TAG" --generate-notes --target "${GITHUB_SHA}"
            fi
          else
            echo "release $TAG already exists; uploading assets to it"
          fi
          retry gh release upload "$TAG" artifacts/* -R "${GITHUB_REPOSITORY}" --clobber
